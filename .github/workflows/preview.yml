name: Preview

# Every pull request gets its own Worker Preview, pr-<number>, of the fixed Worker gnomik-api-preview, with its own
# URL and its own Durable Objects (empty, never production data). It is redeployed on every push and deleted when the
# pull request is closed. These jobs only ever see CLOUDFLARE_PREVIEW_API_TOKEN (a secret of the `preview` environment),
# which can edit gnomik-api-preview and nothing else; the production token lives in the `production` environment, which
# only main can deploy to.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW: pr-${{ github.event.pull_request.number }}
  # Preview URLs are <preview>-<worker>.<subdomain>.workers.dev; uglyunicorn is the account's subdomain.
  PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-gnomik-api-preview.uglyunicorn.workers.dev

jobs:
  ci:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Secrets are not available to pull requests from forks, nor to Dependabot (it has its own secret store).
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # One environment for every pull request: each deploy still records its own URL. A name per pull request made
    # GitHub keep an environment for each one, and the workflow's token can't delete them.
    environment:
      name: preview
      url: ${{ env.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - name: Write preview secrets
        run: |
          umask 077
          jq -n --arg key "$PREVIEW_JWT_PRIVATE_KEY" '{JWT_PRIVATE_KEY: $key}' > "$RUNNER_TEMP/preview-secrets.json"
        env:
          PREVIEW_JWT_PRIVATE_KEY: ${{ secrets.PREVIEW_JWT_PRIVATE_KEY }}
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --env preview --name ${{ env.PREVIEW }} --var PUBLIC_URL:${{ env.PREVIEW_URL }} --secrets-file ${{ runner.temp }}/preview-secrets.json
      - name: Smoke test the preview
        run: npm run smoke
        env:
          SMOKE_URL: ${{ env.PREVIEW_URL }}
      - name: Post the preview URL
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $PREVIEW_URL (commit $SHA, fresh data — not production)"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # CLOUDFLARE_PREVIEW_API_TOKEN is a secret of this environment, so only jobs that name it can read it.
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      # A Preview's name stays unreliable for a while after it is deleted (some requests fail with error 1101), so a
      # reopened pull request may need a minute before its Preview answers every request.
      - name: Delete the Preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview delete --env preview --name ${{ env.PREVIEW }} --skip-confirmation
