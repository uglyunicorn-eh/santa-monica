name: Preview

# Every pull request gets its own Worker, gnomik-api-pr-<number>, on workers.dev with its own Durable Objects (empty,
# never production data). It is redeployed on every push and deleted when the pull request is closed.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WORKER: gnomik-api-pr-${{ github.event.pull_request.number }}
  # uglyunicorn is the account's workers.dev subdomain.
  PREVIEW_URL: https://gnomik-api-pr-${{ github.event.pull_request.number }}.uglyunicorn.workers.dev

jobs:
  ci:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Secrets are not available to pull requests from forks.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ env.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - name: Write preview secrets
        run: |
          umask 077
          printf 'JWT_SECRET=%s\n' "$PREVIEW_JWT_SECRET" > "$RUNNER_TEMP/preview-secrets.env"
        env:
          PREVIEW_JWT_SECRET: ${{ secrets.PREVIEW_JWT_SECRET }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview --name ${{ env.WORKER }} --var PUBLIC_URL:${{ env.PREVIEW_URL }} --secrets-file ${{ runner.temp }}/preview-secrets.env
      - name: Smoke test the preview
        run: npm run smoke
        env:
          SMOKE_URL: ${{ env.PREVIEW_URL }}
      - name: Post the preview URL
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $PREVIEW_URL (commit $SHA, fresh data — not production)"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - name: Delete the preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name ${{ env.WORKER }} --force
