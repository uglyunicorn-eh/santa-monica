name: CI

on:
  # Pull requests are tested through `pull_request` (the branch merged into main); pushes only for main itself.
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - run: npm run typecheck
      - name: Unit tests (100% coverage required)
        run: npm run test:unit
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - name: Integration tests
        run: npm run test:integration
