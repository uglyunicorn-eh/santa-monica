name: Deploy to Cloudflare

# Manual only until cutover (docs/MIGRATION_PLAN.md, Phase 3). Add `push: branches: [main]` afterwards.
on:
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx -y npm@11 ci
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test the deployment
        run: npm run smoke
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL || steps.deploy.outputs.deployment-url }}
